name: Deploy family PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare public runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            const { SUPABASE_URL, SUPABASE_ANON_KEY, VAPID_PUBLIC_KEY = "" } = process.env;
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) throw new Error("Add SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first.");
            await writeFile("dist/config.json", JSON.stringify({ url: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY, vapidPublicKey: VAPID_PUBLIC_KEY }));
          '
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
